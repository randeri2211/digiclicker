<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #10161d;
      --panel-2: #0d1319;
      --panel-border: rgba(45, 212, 191, 0.22);
      --panel-border-strong: rgba(45, 212, 191, 0.45);
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.12);
      --pos: #39ff88;
      --pos-soft: rgba(57, 255, 136, 0.12);
      --warn: #ffb020;
      --danger: #ff3b5c;
      --text-h: #e8fbff;
      --text: #8fa8ad;
      --text-dim: #4d6166;
      --mono: 'Share Tech Mono', ui-monospace, Consolas, monospace;
      --head: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
    }
    a { color: var(--accent); }
    a:hover { color: #7fe8f7; }

    .screen {
      position: relative;
      width: 1440px;
      height: 900px;
      background:
        radial-gradient(ellipse 900px 500px at 50% -10%, rgba(34,211,238,0.07), transparent 60%),
        repeating-linear-gradient(0deg, rgba(34,211,238,0.035) 0px, rgba(34,211,238,0.035) 1px, transparent 1px, transparent 40px),
        repeating-linear-gradient(90deg, rgba(34,211,238,0.035) 0px, rgba(34,211,238,0.035) 1px, transparent 1px, transparent 40px),
        var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- top bar ---- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 24px;
      height: 64px;
      padding: 0 24px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(13, 19, 25, 0.85);
      flex-shrink: 0;
    }
    .logo {
      font-family: var(--head);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--text-h);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo .dot { width: 8px; height: 8px; background: var(--pos); box-shadow: 0 0 8px var(--pos); }
    .currency-row { display: flex; gap: 12px; margin-left: auto; }
    .currency {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      font-size: 15px;
      color: var(--text-h);
    }
    .currency svg { flex-shrink: 0; }
    .currency .bits { color: var(--pos); }
    .currency .data { color: var(--accent); }

    .icon-btn {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text-h);
      cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--panel-border-strong); }
    .badge {
      position: absolute;
      top: -7px;
      right: -7px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      background: var(--warn);
      color: #1a1300;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
    }

    /* ---- main layout ---- */
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* ---- combat panel ---- */
    .combat {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 32px;
      min-width: 0;
    }
    .area-label {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .area-name {
      font-family: var(--head);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-h);
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .arena {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 500px 300px at 50% 60%, rgba(34,211,238,0.08), transparent 70%);
      border: 1px solid var(--panel-border);
    }

    .enemy-tag {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .enemy-name {
      font-family: var(--head);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-h);
      letter-spacing: 1px;
    }
    .enemy-lv {
      font-size: 12px;
      padding: 3px 8px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--panel-border-strong);
    }

    .hp-bar-wrap { width: 340px; margin-bottom: 26px; }
    .hp-bar-track {
      height: 14px;
      background: var(--panel-2);
      border: 1px solid var(--panel-border);
      position: relative;
      overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%;
      width: 63%;
      background: linear-gradient(90deg, var(--pos), #1fce6e);
      box-shadow: 0 0 10px rgba(57,255,136,0.5);
    }
    .hp-text {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text);
      margin-top: 6px;
    }

    .sprite-click-target {
      position: relative;
      cursor: pointer;
    }
    .sprite-click-target img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(34,211,238,0.25));
    }
    .sprite-ring {
      position: absolute;
      inset: -18px;
      border: 1px dashed var(--panel-border-strong);
      border-radius: 50%;
    }
    .dmg-pop {
      position: absolute;
      top: 20px;
      right: -10px;
      font-family: var(--head);
      font-size: 26px;
      font-weight: 800;
      color: var(--warn);
      text-shadow: 0 0 10px rgba(255,176,32,0.6);
    }
    .tame-readout {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text);
    }
    .tame-readout b { color: var(--pos); }

    .area-tabs {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .area-tab {
      padding: 8px 16px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
    }
    .area-tab.active { color: var(--text-h); border-color: var(--accent); background: var(--accent-soft); }
    .area-tab.locked { color: var(--text-dim); display: flex; align-items: center; gap: 6px; }

    /* ---- sidebar ---- */
    .sidebar {
      width: 340px;
      flex-shrink: 0;
      border-left: 1px solid var(--panel-border);
      background: rgba(13, 19, 25, 0.6);
      padding: 24px 20px;
      overflow-y: auto;
    }
    .evolve-btn {
      appearance: none;
      font: inherit;
      font-family: var(--mono);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 24px;
      background: var(--pos-soft);
      border: 1px solid rgba(57, 255, 136, 0.4);
      color: var(--text-h);
      cursor: pointer;
    }
    .evolve-btn:hover { border-color: var(--pos); }
    .evolve-btn .evolve-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pos);
    }
    .evolve-btn .evolve-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .evolve-btn .evolve-label {
      font-family: var(--head);
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .evolve-btn .evolve-sub { font-size: 11px; color: var(--pos); }
    .evolve-btn .evolve-chevron { margin-left: auto; color: var(--text-dim); }

    .side-section { margin-bottom: 28px; }
    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .side-title {
      font-family: var(--head);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-h);
    }
    .side-title.training { color: var(--text); }
    .side-count { font-size: 12px; color: var(--text-dim); }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .slot {
      aspect-ratio: 1;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .slot.active-slot { border-color: var(--panel-border-strong); }
    .slot img { width: 78%; height: 78%; object-fit: contain; }
    .slot-lv {
      position: absolute;
      left: 4px;
      bottom: 4px;
      font-size: 10px;
      padding: 1px 5px;
      background: rgba(10,14,20,0.85);
      color: var(--text-h);
      border: 1px solid var(--panel-border);
    }
    .slot-ready {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      background: var(--warn);
      box-shadow: 0 0 6px var(--warn);
      border-radius: 50%;
    }
    .slot.empty {
      color: var(--text-dim);
      font-size: 22px;
      border-style: dashed;
    }
    .slot.locked {
      color: var(--text-dim);
      font-size: 14px;
      border-style: dashed;
      opacity: 0.5;
    }

    .xp-note {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 10px;
    }
  </style>
</helmet>

<div class="screen">

  <div class="topbar">
    <div class="logo"><span class="dot"></span>DIGICLICKER</div>
    <div class="currency-row">
      <div class="currency">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="bits"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v10M9 9.5c0-1.4 1.3-2 3-2s3 .8 3 2-1.3 1.8-3 2-3 .6-3 2 1.3 2 3 2 3-.6 3-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>128,430</span>
      </div>
      <div class="currency">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="data"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 12h8M8 15h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>3,204</span>
      </div>
    </div>
    <div class="icon-btn" title="Ready to digivolve">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="2.3" r="1" stroke="currentColor" stroke-width="1.4"/>
        <rect x="6" y="3.6" width="12" height="17" rx="6" stroke="currentColor" stroke-width="1.6"/>
        <rect x="8.7" y="7" width="6.6" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10.3 10.2l1.7-1.9 1.7 1.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9.3" cy="16.3" r="0.9" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="14.7" cy="16.3" r="0.9" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <span class="badge">4</span>
    </div>
    <div class="icon-btn" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 01-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 010-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 014 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019 9c.14.36.4.66.74.86.24.14.5.22.77.24H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.51 1z" stroke="currentColor" stroke-width="1.4"/></svg>
    </div>
  </div>

  <div class="main">

    <div class="combat">
      <div class="area-label">Digital World &mdash; File Island</div>
      <div class="area-name">FOREST SECTOR</div>

      <div class="arena">
        <div class="enemy-tag">
          <span class="enemy-name">Betamon</span>
          <span class="enemy-lv">Lv. 8</span>
        </div>
        <div class="hp-bar-wrap">
          <div class="hp-bar-track"><div class="hp-bar-fill"></div></div>
          <div class="hp-text"><span>HP</span><span>412 / 650</span></div>
        </div>
        <div class="sprite-click-target">
          <div class="sprite-ring"></div>
          <img src="agumon.png" alt="wild digimon">
          <div class="dmg-pop">-42</div>
        </div>
        <div class="tame-readout">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.6"/></svg>
          Tame chance on defeat: <b>27%</b>
        </div>
      </div>

      <div class="area-tabs">
        <div class="area-tab active">Forest Sector</div>
        <div class="area-tab">Cave Sector</div>
        <div class="area-tab locked">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="1.8"/></svg>
          Server Continent
        </div>
      </div>
    </div>

    <div class="sidebar">
      <button class="evolve-btn">
        <span class="evolve-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="2.3" r="1" stroke="currentColor" stroke-width="1.4"/>
            <rect x="6" y="3.6" width="12" height="17" rx="6" stroke="currentColor" stroke-width="1.6"/>
            <rect x="8.7" y="7" width="6.6" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10.3 10.2l1.7-1.9 1.7 1.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9.3" cy="16.3" r="0.9" stroke="currentColor" stroke-width="1.3"/>
            <circle cx="14.7" cy="16.3" r="0.9" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </span>
        <span class="evolve-copy">
          <span class="evolve-label">Evolution</span>
          <span class="evolve-sub">4 ready to digivolve</span>
        </span>
        <span class="evolve-chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>

      <div class="side-section">
        <div class="side-head">
          <div class="side-title">Active Team</div>
          <div class="side-count">3 / 5</div>
        </div>
        <div class="slot-grid">
          <div class="slot active-slot"><img src="greymon.png" alt="Greymon"><span class="slot-lv">Lv 22</span></div>
          <div class="slot active-slot"><img src="patamon.png" alt="Patamon"><span class="slot-lv">Lv 14</span><span class="slot-ready"></span></div>
          <div class="slot active-slot"><img src="biyomon.png" alt="Biyomon"><span class="slot-lv">Lv 9</span></div>
          <div class="slot empty">+</div>
          <div class="slot locked">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="1.8"/></svg>
          </div>
        </div>
      </div>

      <div class="side-section">
        <div class="side-head">
          <div class="side-title training">Training Team</div>
          <div class="side-count">1 / 3</div>
        </div>
        <div class="slot-grid">
          <div class="slot"><img src="gomamon.png" alt="Gomamon"><span class="slot-lv">Lv 5</span></div>
          <div class="slot empty">+</div>
          <div class="slot locked">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="1.8"/></svg>
          </div>
        </div>
        <div class="xp-note">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.4H22l-6.2 4.5L18 21l-6-4.4L6 21l2.2-7.1L2 9.4h7.6L12 2z" stroke="currentColor" stroke-width="1.3"/></svg>
          Full XP per kill, same as active team
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
