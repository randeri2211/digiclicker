name: Validate areas

on:
  push:
    paths:
      - 'src/lib/data/areas/**'
      - 'validate_areas.py'
      - 'src/lib/data/mysteryEggWeights.json'
      - 'validate_mystery_eggs.py'
      - 'src/lib/data/digimon-evolution.json'
  pull_request:
    paths:
      - 'src/lib/data/areas/**'
      - 'validate_areas.py'
      - 'src/lib/data/mysteryEggWeights.json'
      - 'validate_mystery_eggs.py'
      - 'src/lib/data/digimon-evolution.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validate_areas.py
      - run: python validate_mystery_eggs.py
