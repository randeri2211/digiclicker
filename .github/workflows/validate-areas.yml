name: Validate areas

on:
  push:
    paths:
      - 'src/lib/data/quests.json'
      - 'validate_quests.py'
      - 'src/lib/game/items/itemCatalog.ts'
      - 'src/lib/data/areas/**'
      - 'src/lib/data/regions.json'
      - 'validate_areas.py'
      - 'src/lib/data/mysteryEggWeights.json'
      - 'validate_mystery_eggs.py'
      - 'src/lib/data/digimon-evolution.json'
      - 'src/lib/data/elementChart.json'
      - 'element_mapping.py'
      - 'validate_elements.py'
  pull_request:
    paths:
      - 'src/lib/data/quests.json'
      - 'validate_quests.py'
      - 'src/lib/game/items/itemCatalog.ts'
      - 'src/lib/data/areas/**'
      - 'src/lib/data/regions.json'
      - 'validate_areas.py'
      - 'src/lib/data/mysteryEggWeights.json'
      - 'validate_mystery_eggs.py'
      - 'src/lib/data/digimon-evolution.json'
      - 'src/lib/data/elementChart.json'
      - 'element_mapping.py'
      - 'validate_elements.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validate_areas.py
      - run: python validate_mystery_eggs.py
      - run: python validate_elements.py
      - run: python validate_quests.py
