server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sprites keep their names when regenerated (optimize_sprites.py), so
    # cache for a week rather than forever.
    location /sprites/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
