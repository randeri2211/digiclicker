services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    profiles:
      - prod

  importer:
    build:
      context: .
      dockerfile: Dockerfile.importer
    volumes:
      # Source art only (git-ignored); optimize_sprites.py builds the
      # shipped public/sprites/ from it.
      - ./art/digimon/images:/app/art/digimon/images
    profiles:
      - tools
