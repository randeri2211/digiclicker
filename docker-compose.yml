services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    profiles:
      - prod

  importer:
    build:
      context: .
      dockerfile: Dockerfile.importer
    volumes:
      - ./public/digimon/images:/app/public/digimon/images
    profiles:
      - tools
